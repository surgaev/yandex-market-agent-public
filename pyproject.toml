[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ym-agent"
version = "0.1.0"
description = "Аналитика продавца Яндекс Маркета: реальная прибыль на штуку, сверка выплат, буст, остатки FBS/FBY → Excel-отчёт"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "openpyxl>=3.1.2",
    "beautifulsoup4>=4.12.0",
    "python-dateutil>=2.8.2",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
ym-agent = "ym_agent.cli:main"

[project.urls]
Repository = "https://github.com/surgaev/yandex-market-agent-public"

[tool.setuptools]
packages = ["ym_agent"]
